version = 1

[gemma-4-26b-a4b-it]
model = /path/to/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
mmproj = /path/to/mmproj-F16-gemma4.gguf
mmproj-device = CUDA1

threads = 6
ctx-size = 90000
parallel = 1

device = CUDA0
n-gpu-layers = all

flash-attn = on
batch-size = 2048
ubatch-size = 512



temp = 1.0
top-k = 64
top-p = 0.95
min-p = 0.0
repeat-penalty = 1.0

spec-type = draft-mtp
spec-draft-model = /path/to/mtp-gemma-4-26B-A4B-it.gguf
spec-draft-n-max = 1
spec-draft-device = CUDA0
spec-draft-ngl = all

split-mode = none
main-gpu = 0

jinja = true
reasoning = on
reasoning-budget = 1024

load-on-startup = true

cache-type-k = q4_0
cache-type-v = q4_0

cache-type-k-draft = q4_0
cache-type-v-draft = q4_0
