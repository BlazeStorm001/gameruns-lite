name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Stage game and traces
        run: |
          mkdir -p _site/traces
          cp examples/neon-breach/qwen3.8-27b/game/index.html _site/
          cp -R examples/neon-breach/qwen3.8-27b/game/js _site/
          cp examples/neon-breach/qwen3.8-27b/traces.html _site/traces/qwen3.8-27b.html
          cp examples/neon-breach/gemma4-26b-a4b/traces.html _site/traces/gemma4-26b-a4b.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
